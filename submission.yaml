submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    FDA's FAERS database holds 20M+ adverse event reports that pharmacovigilance teams
    must manually sift through to catch safety signals — a process that takes weeks and
    has historically been too slow (Vioxx caused 27,000+ heart attacks before its signal
    was acted on). Separately, regulatory affairs teams assemble 100,000+ page CTD drug
    approval dossiers across 5 modules, where a single missing section causes rejection,
    costing 6-12 months and $50-100M. Both problems share the same root cause: too much
    complex data for manual review.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    A two-mode tool: a PRR/ROR disproportionality engine that pulls live FDA adverse event
    reports via OpenFDA and flags statistically significant drug-event safety signals using
    the Evans et al. (2001) criteria; and a CTD submission checker that parses a draft
    regulatory document (PDF/DOCX/TXT) and scores its completeness against the ICH M4 CTD
    structure, module by module, with a downloadable gap report. Both modes are available
    as a Streamlit dashboard and as a REST/OpenAPI service for IBM watsonx Orchestrate.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Live PRR + ROR disproportionality analysis against real OpenFDA adverse event data, flagging signals via the Evans et al. (2001) PRR>=2 / chi2>=4 / n>=3 criteria"
    - "CTD submission gap checker that parses PDF/DOCX/TXT drafts and scores completeness per ICH M4 module, not just an overall number"
    - "Interactive Streamlit dashboard: risk-filterable signal tables, Plotly charts color-coded by risk level, CSV/report export"
    - "FastAPI + auto-generated OpenAPI tool layer for wiring both modes into IBM watsonx Orchestrate as agent-callable tools"
    - "Optional watsonx.ai-generated plain-language signal explanations, with a safe template fallback when no credentials are configured"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "FastAPI", "Plotly"]
    ibm_technologies: ["watsonx.ai (ibm-watsonx-ai SDK)", "watsonx Orchestrate (via OpenAPI tool import)"]
    databases: []
    other: ["pandas", "numpy", "scipy", "OpenFDA REST API", "PyPDF2", "python-docx", "pytest"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The signal-detection engine wasn't just implemented — it was validated live against
    real FDA data during development: aspirin correctly surfaces GI-bleeding-adjacent
    signals, warfarin correctly flags 15 bleeding-related reactions (PRR 2.5-35), and an
    SSRI (citalopram) correctly shows the right-direction QT-prolongation signal. We also
    caught and fixed three real bugs by testing against live data and a real EMA
    regulatory PDF rather than trusting the code on paper: an OpenFDA anonymous rate-limit
    issue, a drug-attribution leak in the signal table, and a CTD-heading
    false-positive/false-negative pair in the document parser.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    bob_sessions/ is not yet populated — that requires real IBM Bob IDE usage, which
    hasn't happened yet. The watsonx.ai LLM-explanation path is implemented but untested
    with real credentials (falls back to template explanations without them). The
    watsonx Orchestrate console wiring (importing the tool, building the agent) still
    needs to be done manually in the IBM Cloud console — see ORCHESTRATE.md. The CTD
    checker detects section headings structurally and cannot distinguish an actual
    filled-in dossier from a reference document that merely tabulates the same section
    numbers (confirmed against a real EMA guideline PDF during testing). No demo video
    or slide deck yet.

